<h2 class="h5 heading">Form Pendataan Sampah Real-Time</h2>
<p class="text-muted small">Isi data setoran di lokasi penjemputan. Total harga dan potongan dihitung otomatis.</p>

<form id="formSetoran" novalidate>
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label" for="pickup_id">Tugas Penjemputan (pickup_id)</label>
      <select id="pickup_id" name="pickup_id" class="form-select"></select>
      <div class="invalid-msg">Pilih tugas penjemputan terlebih dahulu.</div>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label" for="warga_id">ID Warga (warga_id)</label>
      <input type="text" id="warga_id" name="warga_id" class="form-control" readonly>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label" for="tgl_setor">Tanggal</label>
      <input type="text" id="tgl_setor" name="tgl_setor" class="form-control" readonly>
    </div>
    <div class="col-12">
      <label class="form-label" for="alamat">Alamat Penjemputan</label>
      <input type="text" id="alamat" class="form-control" readonly>
    </div>

    <div class="col-12 col-md-4">
      <label class="form-label" for="jenis_id">Jenis Sampah (jenis_id)</label>
      <select id="jenis_id" name="jenis_id" class="form-select"></select>
      <div class="invalid-msg">Pilih jenis sampah.</div>
    </div>
    <div class="col-12 col-md-4">
      <span class="form-label d-block">Kondisi</span>
      <div class="d-flex gap-3 pt-2">
        <div class="form-check"><input class="form-check-input" type="radio" name="kondisi" id="kKotor" value="kotor"><label class="form-check-label" for="kKotor">Kotor</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="kondisi" id="kBersih" value="bersih"><label class="form-check-label" for="kBersih">Bersih</label></div>
      </div>
      <div class="invalid-msg" id="msgKondisi">Pilih kondisi sampah.</div>
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label" for="berat">Berat (kg)</label>
      <input type="number" id="berat" name="berat" class="form-control" step="0.1" min="0" placeholder="contoh: 2.5">
      <div class="invalid-msg" id="msgBerat">Berat harus lebih dari 0 kg.</div>
    </div>

    <div class="col-12 col-md-4">
      <label class="form-label" for="total_harga">Total Harga</label>
      <input type="text" id="total_harga" class="form-control" readonly value="Rp0">
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label" for="potongan_jemput">Potongan Jemput</label>
      <input type="text" id="potongan_jemput" class="form-control" readonly value="Rp2.000">
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label" for="total_bersih">Total Bersih</label>
      <input type="text" id="total_bersih" class="form-control" readonly value="Rp0">
    </div>
    <div class="col-12"><div class="invalid-msg" id="msgTotal">Total harga belum cukup untuk dipotong tarif jemput Rp2.000.</div></div>
  </div>

  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-primary-app">Simpan Data</button>
    <button type="reset" class="btn btn-secondary-app" id="btnResetForm">Reset</button>
  </div>
</form>
